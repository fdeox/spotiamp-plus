# Builds the Windows installer from this repository on every change, so each
# release can be traced back to a commit (and, later, signed through the
# SignPath Foundation; see CODE_SIGNING.md). The installer is kept as a
# downloadable artifact of the run.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # The updater's own signature needs the private key, which stays off
      # GitHub for now, so the installer is built without it here.
      - name: Build the installer
        shell: bash
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: spotiamp-plus-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
