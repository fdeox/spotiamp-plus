[package]
name = "spotiamp"
version = "0.7.9"
description = "Spotiamp+ — a Winamp-style Spotify desktop player"
authors = ["Ted Steen", "fdeox"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spotiamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["freetype"]
# older modern skins' text drawn as Winamp's FreeType renderer drew it (wasabi_text.rs)
freetype = ["dep:freetype-sys"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri's defaults less "compression": the pages go into the exe as they are and
# the installer's LZMA packs them tighter than brotli did one by one (it stays
# under Discord's 10 MB that way); nothing else changes
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34-depricated"

thiserror = "2"
log = "0.4"
env_logger = "0.11"
librespot = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
# librespot's own protobuf version, to ask for many tracks' info in one request
# (spotify::fetch_tracks).
protobuf = "3.7"
# Same cpal that librespot's rodio backend resolves — used to enumerate output
# devices for the audio-device picker (so device names match what rodio expects),
# and (0.7.0) to output decoded local files through the same EQ + visualizer.
cpal = "0.16"
# Local-file playback (0.7.0). symphonia is already in the tree — librespot pulls
# it for Ogg/Vorbis — so this only turns on the extra decoders (MP3/FLAC/AAC/WAV)
# and adds almost nothing to the build.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "aac", "alac", "isomp4", "pcm", "adpcm", "wav", "ogg", "vorbis"] }
audioviz = { version = "0.6", default-features = false, features = ["spectrum"] }

oauth2 = "5.0"
rustls = "0.23"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
tokio = { version = "1.48", default-features = false, features = ["net", "sync", "time", "macros"] }
# Soloist's local WebSocket API (soloist.rs); already in the tree through librespot
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false }
http = "1"
url = "2.5"
directories = "6.0"
tauri-plugin-dialog = "2.7"
# Guarantees a single running instance: a second launch focuses the existing
# window instead of spawning a duplicate that plays over the first.
tauri-plugin-single-instance = "2"
# In-app updates: checks a signed manifest, downloads and installs the new
# build. `process` provides the relaunch afterwards.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
base64 = "0.22"
# Last.fm signs its calls with MD5 (lastfm.rs)
md-5 = "0.10"
# AAC with HE-AAC's high band and stereo (decoding.rs): symphonia plays only
# the core, so AAC+ stations sounded dull
rusty_aac = "1.1"
# Opus files and stations (decoding.rs): symphonia reads Ogg Opus but has no
# decoder for it; this one is pure Rust
opus-decoder = "0.1.1"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
discord-rich-presence = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSGraphics", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # .m3u files from older players are in the system code page, not UTF-8.
    "Win32_Globalization",
    # Controller ("free") mode reads and drives the system media session.
    "Media_Control",
    # ...and the cover picture the Spotify app gives its session
    "Storage_Streams",
    # Publishing our own session: the headset buttons and the Windows media
    # panel. Interop is what binds a session to a plain desktop window handle.
    "Media",
    "Win32_System_WinRT",
    "Foundation",
    # Now Playing card: WebView2 CapturePreview writes a PNG into a COM stream.
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    # Taskbar extras: thumbnail-button icons are drawn into a DIB.
    "Win32_Graphics_Gdi",
    # Copy diagnostic info: the Windows build (registry) and the clipboard.
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    # MilkDrop: projectM draws with OpenGL into a child window
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    # ...and says when the pointer leaves it
    "Win32_UI_Input_KeyboardAndMouse",
    # ...and opens texture folders by their short (ASCII) names
    "Win32_Storage_FileSystem",
    # Global hotkeys: the thread that holds them is told to let go
    "Win32_System_Threading",
    # WMA and other files symphonia can't read: Media Foundation decodes them,
    # the shell's property system reads their tags (mf.rs)
    "Win32_Media_MediaFoundation",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    # Soloist runs in a job object (it ends with us) and an earlier run's is found by its path
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }
# Modern skins older than 1.3: their text as Winamp's FreeType renderer drew
# it (wasabi_text.rs), FreeType built from source (see .cargo/config.toml)
freetype-sys = { version = "0.23", features = ["bundled"], optional = true }
# MilkDrop: projectM-4.dll / glew32.dll are loaded at runtime, so the app still
# runs (without MilkDrop) if they're missing
libloading = "0.8"
# Same version wry/tauri already build, so the WebView2 types line up: used to
# catch a crashed renderer and reload it (app_window::watch_for_renderer_crash),
# and for the paths of files dropped from Explorer (file_drop.rs).
webview2-com = "0.38"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.

# NOTE: This causes a crash at startup around audio. Not sure why
# opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.

panic = "abort" # Higher performance by disabling panic handlers.
strip = true    # Ensures debug symbols are removed.
